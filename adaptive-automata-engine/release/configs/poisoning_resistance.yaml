experiment:
  name: poisoning_resistance
  description: "Evaluates model resilience against malicious transition injection attacks."
  seeds: [1, 2, 3, 4, 5]

dataset:
  protocol: toy_protocol
  train_size: 1000
  validation_size: 200
  test_size: 500
  categories:
    - normal
    - poisoning

models:
  - static_dfa
  - static_hierarchical
  - naive_adaptive
  - proposed

output_dir: experiments/results
