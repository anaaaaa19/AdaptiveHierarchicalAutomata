experiment:
  name: unseen_behavior
  description: "Evaluates detection performance on previously unseen protocol behaviors and zero-day style attacks."
  seeds: [1, 2, 3, 4, 5]

dataset:
  protocol: toy_protocol
  train_size: 1000
  validation_size: 200
  test_size: 500
  categories:
    - normal
    - unseen
    - structural_anomaly

models:
  - static_dfa
  - static_hierarchical
  - naive_adaptive
  - proposed

output_dir: experiments/results
